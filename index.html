<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Форма</title>
  <style> body { font-family: sans-serif; padding: 20px; } </style>
</head>
<body>
  <h2>Заполните форму</h2>
  <form id="myForm">
    <input type="text" name="name" placeholder="Имя" required><br><br>
    <textarea name="message" placeholder="Сообщение"></textarea><br><br>
    <button type="submit">Отправить</button>
  </form>

  <hr>
  <h3>Чат с админами</h3>
  <div id="chat" style="border:1px solid #ccc; height:200px; overflow-y:scroll; padding:10px;"></div>
  <input type="text" id="msgInput" placeholder="Введите сообщение..." />
  <button onclick="sendMessage()">Отправить</button>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
